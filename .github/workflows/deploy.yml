name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/apps/OharaBot-JS
            git pull origin main
            docker build -t ohara-bot .
            docker stop ohara-bot || true
            docker rm ohara-bot || true
            docker run -d --name ohara-bot --network ohara-network --restart always --env-file .env ohara-bot